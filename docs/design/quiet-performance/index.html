function render(focus=true){document.documentElement.lang=lang;document.body.classList.toggle('board',board);document.body.classList.toggle('simple',simple);$$('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('#language').setAttribute('aria-label',t('language'));$('#close-dialog').setAttribute('aria-label',t('close'));$('.skip').textContent=lang==='hi'?'मुख्य सामग्री पर जाएँ':'Skip to content';$('.nav').setAttribute('aria-label',lang==='hi'?'मुख्य नेविगेशन':'Main navigation');$('.nav').innerHTML=['start','practice','progress'].map(k=>`<button data-page="${k}" ${k===(['setup','session','result'].includes(page)?'start':page)?'aria-current="page"':''}>${icon(k)}<span>${t(k)}</span></button>`).join('');$('#main').innerHTML=Object.entries(frames).filter(([k])=>board||k===page).map(([k,fn],i)=>`<section class="screen" id="${k}" data-frame="${i+1} / ${t(k==='setup'?'setup':k==='session'?'sample':k==='result'?'result':k)}">${fn()}</section>`).join('');$('#simple').textContent=t(simple?'simpleOn':'simple');$('#simple').setAttribute('aria-pressed',simple);$('#board').textContent=t(board?'backPrototype':'allFrames');$('#board').setAttribute('aria-pressed',board);if($('#search'))$('#search').value=search;if(focus)$('#main').focus({preventScroll:true});}
function navigate(next){if($('#dialog').open)$('#dialog').close();page=next;render();window.scrollTo({top:0,behavior:'instant'});}
function openDialog(kind,from){const wasOpen=$('#dialog').open;if(!wasOpen)trigger=from;let title='',body='';if(kind==='privacy'){title=t('privacyTitle');body=`<p>${t('privacyDesc')}</p><div class="notice">${t('privacyPreview')}</div>`;}if(kind==='help'){title=t('helpTitle');body=`<p>${t('helpDesc')}</p><h3>${t('helpCamera')}</h3><p>${t('helpCameraDesc')}</p>${button('watch','data-dialog="guide"',true)}`;}if(kind==='guide'){title=t('guideTitle');body=`<ol class="checklist">${['guide1','guide2','guide3'].map((k,i)=>`<li><span aria-hidden="true">${i+1}</span><p>${t(k)}</p></li>`).join('')}</ol>${chosen!=='squat'?`<p class="small">${t('guideOther')}</p>`:''}`;}if(kind==='design'){title=t('designTitle');body=`<p>${t('designIntro')}</p><ul>${[1,2,3,4,5].map(i=>`<li>${t('design'+i)}</li>`).join('')}</ul><p class="small">${t('designEnd')}</p>`;}if(kind==='history'){title=t('jumpHistory');body=chart()+`<p class="small">${t('limit')}</p>`;}if(kind==='finish'){title=t('finished');body=`<p>${t('finishNote')}</p>${button('finish','data-page="result"')}`;}$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;if(!wasOpen)$('#dialog').showModal();else{$('#dialog-title').setAttribute('tabindex','-1');$('#dialog-title').focus();}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)navigate(b.dataset.page);if(b.dataset.select){chosen=b.dataset.select;count=0;sessionState='ready';navigate('setup');}if(b.dataset.dialog)openDialog(b.dataset.dialog,b);if(b.dataset.filter){filter=b.dataset.filter;$$('[data-filter]').forEach(el=>el.setAttribute('aria-pressed',el===b));$('#test-list').innerHTML=cards();}if(b.dataset.period){period=Number(b.dataset.period);render(false);$(`[data-period="${period}"]`)?.focus();}const action=b.dataset.action;if(action==='clear'){search='';filter='all';render(false);$('#search').focus();}if(action==='session'){count=0;sessionState='ready';navigate('session');}if(action==='rep'&&sessionState==='ready'){count++;$('.count').textContent=count;}if(action==='lost'||action==='recover'||action==='pause'){if(action==='lost'){beforeLoss=sessionState;sessionState='lost';}else if(action==='recover')sessionState=beforeLoss;else sessionState=sessionState==='paused'?'ready':'paused';render(false);$('.session-side h2').setAttribute('tabindex','-1');$('.session-side h2').focus({preventScroll:true});}if(action==='finish')openDialog('finish',b);});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;$('#test-list').innerHTML=cards();}});$('#language').addEventListener('change',e=>{lang=e.target.value;render(false);});$('#simple').onclick=()=>{simple=!simple;render(false);$('#simple').focus({preventScroll:true});};$('#board').onclick=()=>{board=!board;render(false);window.scrollTo(0,0);};$('#close-dialog').onclick=()=>$('#dialog').close();$('#dialog').addEventListener('close',()=>{if(trigger?.isConnected)trigger.focus();});$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});render(false);
</script>
